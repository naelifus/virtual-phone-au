

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Raka's iPhone</title>
<style>
:root {
  --wallpaper: linear-gradient(145deg,#202b48,#8476a9,#d5a9bd);
  --accent: #007aff;
  --text: #111;
  --muted: #8e8e93;
  --panel: #f2f2f7;
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; display:flex; align-items:center;
  justify-content:center; background:#171719;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
}
button,input,textarea { font:inherit; }
button { cursor:pointer; }

.phone {
  width: 280px;
  height: 606px;
  aspect-ratio: 390 / 844;
  min-height: 0;
  max-width: 100%;
  position: relative;
  overflow: hidden;
  background: var(--wallpaper);
  color: white;
  flex-shrink: 0;
  border: 5px solid #28282c;
  border-radius: 36px;
  box-shadow: 0 20px 70px #0009;
}

@media (min-width: 500px) {
  body {
    padding: 16px;
    min-height: 100vh;
    min-height: 100dvh;
  }
}

.phone {
  width: min(280px, calc((100dvh - 32px) * 390 / 844));
  height: min(606px, calc(100dvh - 32px));
  max-width: 100%;
  border: 5px solid #28282c;
  border-radius: 36px;
  box-shadow: 0 20px 70px #0009;
}


@media (max-width: 499px) {
  body {
    display: block;
    padding: 0;
    min-height: 100dvh;
  }

  .phone {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    max-width: none;
    border: 0;
    border-radius: 0;
  }
}

.status {
  height:39px; padding:12px 27px 0; display:flex;
  justify-content:space-between; align-items:center;
  font-size:12px; font-weight:700; position:relative; z-index:10;
}
.status-right { display:flex; align-items:center; gap:5px; }
.island {
  position:absolute; top:8px; left:50%; transform:translateX(-50%);
  width:105px; height:29px; background:#000; border-radius:20px;
}
.screen { position:absolute; inset:39px 0 0; display:none; }
.screen.active { display:block; }
#lock {
  inset:0; padding-top:75px; text-align:center;
  background:var(--wallpaper);
}
.lock-date { font-size:16px; font-weight:500; }
.lock-clock { font-size:78px; line-height:1.1; font-weight:300; letter-spacing:-4px; }
.lock-notice {
  margin:30px 17px 0; padding:14px; border-radius:17px;
  background:#ffffff36; backdrop-filter:blur(25px);
  text-align:left; color:white;
}
.lock-bottom {
  position:absolute; bottom:32px; left:0; right:0;
  display:flex; justify-content:space-around; align-items:center;
}
.round-btn {
  width:45px; height:45px; border-radius:50%; border:0;
  background:#ffffff35; color:white; font-size:20px;
}
.lock-hint { position:absolute; bottom:12px; left:0; right:0; font-size:11px; }
.home {
  inset:0; padding:8px 17px 27px;
  background:var(--wallpaper);
}
.widget {
  margin-top:28px; padding:15px; height:120px; border-radius:23px;
  background:#ffffff25; backdrop-filter:blur(16px);
}
.widget small { opacity:.85; }
.widget strong { display:block; font-size:31px; margin-top:8px; }
.app-grid {
  margin-top:24px; display:grid;
  grid-template-columns:repeat(4,1fr); gap:22px 9px;
}
.app-icon {
  border:0; background:transparent; color:white;
  text-align:center; min-width:0; padding:0;
}
.app-icon .emoji {
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 5px; width:55px; height:55px;
  border-radius:14px; font-size:29px;
  background:#ffffff30; box-shadow:0 4px 9px #0002;
}
.app-icon small {
  display:block; font-size:11px; text-shadow:0 1px 3px #0008;
}
.dock {
  position:absolute; bottom:26px; left:13px; right:13px;
  height:83px; border-radius:26px; background:#ffffff38;
  backdrop-filter:blur(24px); display:flex;
  align-items:center; justify-content:space-evenly;
}
.dock .emoji { width:53px; height:53px; border-radius:14px; }
.app-screen { background:var(--panel); color:var(--text); }
.app-header {
  min-height:53px; padding:9px 15px; display:flex;
  align-items:center; justify-content:space-between; gap:10px;
  background:#f8f8fa; border-bottom:1px solid #dedee3;
}
.app-header h2 { font-size:18px; margin:0; }
.back { border:0; background:transparent; color:var(--accent); font-size:15px; }
.app-body { height:calc(100% - 95px); overflow:auto; padding:14px; }
.list-item {
  width:100%; display:flex; gap:12px; align-items:center;
  padding:12px 2px; border:0; border-bottom:1px solid #dddde2;
  background:transparent; text-align:left; color:inherit;
}
.avatar {
  width:48px; height:48px; flex-shrink:0; display:grid;
  place-items:center; border-radius:50%; font-size:23px;
  background:linear-gradient(145deg,#e5d4f4,#b7c9e9);
}
.item-copy { flex:1; min-width:0; }
.item-copy strong { display:block; font-size:15px; }
.item-copy small { color:var(--muted); display:block; margin-top:4px; }
.chat-view { position:absolute; inset:0; display:none; background:#efe9e2; color:#111; }
.chat-view.active { display:flex; flex-direction:column; }
.chat-top {
  min-height:64px; padding:7px 12px; display:flex;
  align-items:center; gap:8px; background:#f8f8fa;
  border-bottom:1px solid #ddd;
}
.chat-top .avatar { width:38px; height:38px; font-size:19px; }
.chat-top button { border:0; background:none; color:var(--accent); }
.chat-messages {
  flex:1; overflow-y:auto; padding:16px 11px;
  display:flex; flex-direction:column; gap:8px;
  background-color:#efe9e2;
  background-image:radial-gradient(#ffffff90 0.7px,transparent .7px);
  background-size:18px 18px;
}
.day-label {
  align-self:center; padding:5px 10px; border-radius:8px;
  background:#ffffffc9; font-size:11px; color:#555;
}
.bubble {
  max-width:83%; padding:9px 10px 5px; border-radius:14px;
  font-size:14px; line-height:1.4; box-shadow:0 1px 1px #0001;
  overflow-wrap:anywhere;
}
.bubble small { display:block; text-align:right; font-size:10px; color:#777; margin-top:3px; }
.bubble.them { align-self:flex-start; background:white; border-top-left-radius:4px; }
.bubble.me { align-self:flex-end; background:#d9fdd3; border-top-right-radius:4px; }
.chat-compose {
  display:flex; align-items:flex-end; gap:8px; padding:10px;
  background:#f7f7f7; border-top:1px solid #ddd;
}
.chat-compose textarea {
  flex:1; min-width:0; resize:none; max-height:90px;
  border:1px solid #ddd; border-radius:20px;
  padding:10px 13px; outline:none; background:white;
}
.send {
  width:36px; height:36px; flex-shrink:0; border:0;
  border-radius:50%; background:#128c7e; color:white;
}
.tabbar {
  position:absolute; bottom:0; left:0; right:0; height:56px;
  background:#f8f8fa; border-top:1px solid #ddd;
  display:flex; justify-content:space-around; align-items:center;
}
.tabbar button { border:0; background:none; font-size:21px; }
.note {
  width:100%; min-height:180px; border:0; outline:none;
  resize:vertical; background:transparent; font-size:16px;
}
.photo-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:3px; }
.photo {
  aspect-ratio:1; display:grid; place-items:center; font-size:34px;
  background:linear-gradient(140deg,#b8c9e5,#e6bed0,#c6d8c4);
}
.setting-row {
  display:flex; justify-content:space-between; align-items:center;
  padding:16px 12px; margin-bottom:1px; border-radius:9px;
  background:white; font-size:15px;
}
.wallpapers { display:flex; gap:10px; flex-wrap:wrap; margin-top:15px; }
.wallpaper-choice {
  width:55px; height:65px; border:2px solid white; border-radius:12px;
}
.wallpaper-choice:focus { outline:2px solid var(--accent); }
.bottom-indicator {
  position:absolute; bottom:7px; left:50%; transform:translateX(-50%);
  width:108px; height:4px; border-radius:9px; background:white; z-index:50;
}
.app-screen .bottom-indicator { background:#111; }
.toast {
  position:absolute; z-index:80; top:50px; left:15px; right:15px;
  padding:13px; border-radius:15px; color:white;
  background:#333e; display:none; backdrop-filter:blur(18px);
}
.toast.show { display:block; }
</style>
</head>
<body>
<div class="phone" id="phone">

  <div id="lock" class="screen active">

      <button class="app-icon" onclick="openApp('files')"><span class="emoji" style="background:#fff">📁</span><small>Files</small></button>
      <button class="app-icon" onclick="openApp('social')"><span class="emoji" style="background:#fa8c44">📸</span><small>Social</small></button>
      <button class="app-icon" onclick="openApp('calendar')"><span class="emoji" style="background:#fff;color:#ed4545">📅</span><small>Calendar</small></button>
      <button class="app-icon" onclick="openApp('clock')"><span class="emoji" style="background:#ddd">⏰</span><small>Clock</small></button>
      <button class="app-icon" onclick="openApp('weather')"><span class="emoji" style="background:#82c9ff">🌤️</span><small>Weather</small></button>
    </div>
    <div class="dock">
      <button class="app-icon" onclick="openApp('phone')"><span class="emoji" style="background:#32c85b">📞</span></button>
      <button class="app-icon" onclick="openApp('messages')"><span class="emoji" style="background:#32c85b">💬</span></button>
      <button class="app-icon" onclick="openApp('social')"><span class="emoji" style="background:#f4f4f4">📸</span></button>
      <button class="app-icon" onclick="openApp('music')"><span class="emoji" style="background:#fa4268">🎵</span></button>
    </div>
  </div>

  <div id="app" class="screen app-screen">
    <div id="appContent"></div>
    <div class="bottom-indicator" onclick="goHome()"></div>
  </div>
  <div class="bottom-indicator" id="homeIndicator" onclick="goHome()"></div>
  <div class="toast" id="toast"></div>
</div>

  },
  {

    members: ['Raka','Raras','Arya','Anindya','Diajeng','Sekar','Rangga','Rakha'],
    preview: 'grup dibuat',
    messages: [

      {from:'them', name:'Raras', text:'selamat datang di grup paling waras', time:'09:01'},

    ]

];

const WA_STORAGE = 'rakaWhatsAppData';
try {
  const saved = JSON.parse(localStorage.getItem(WA_STORAGE));
  if (saved && Array.isArray(saved.contacts)) {
    saved.contacts.forEach(old => {
      const i = contacts.findIndex(c => c.id === old.id);
      if (i !== -1) contacts[i] = old;
      else contacts.push(old);
    });
  }
} catch (e) {}

function saveWhatsApp() {
  localStorage.setItem(WA_STORAGE, JSON.stringify({contacts}));
}


let currentContact = null;
let activeScreen = 'lock';
let notesTimer;

// ... kode lainnya ...

const timeNow = () => new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',hour12:false});
function updateClock() {
  const d = new Date();
  const t = d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',hour12:false});
  $('statusTime').textContent=t;
  $('lockClock').textContent=t;
  $('homeClock').textContent=t;
  $('lockDate').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  $('homeDate').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase();
}
updateClock();
setInterval(updateClock,15000);

function toast(message) {
  const el=$('toast'); el.textContent=message; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2000);
}
function unlock() {
  $('lock').classList.remove('active');
  $('home').classList.add('active');
  $('homeIndicator').style.display = 'block';
  activeScreen = 'home';
}

window.unlock = unlock;

$('lock').addEventListener('click', e => {
  if (e.target.closest('button')) return;
  unlock();
});
function goHome() {
  $('app').classList.remove('active');
  $('home').classList.add('active');
  $('homeIndicator').style.display='block';
  activeScreen='home';
}
function openApp(name) {
  $('lock').classList.remove('active');
  $('home').classList.remove('active');
  $('homeIndicator').style.display='none';
  $('app').classList.add('active');
  activeScreen=name;
  if(name==='messages') renderChats();
  else if(name==='notes') renderNotes();
  else if(name==='photos') renderPhotos();
  else if(name==='settings') renderSettings();
  else if(name==='music') renderMusic();
  else if(name==='phone') renderPhone();
  else if(name==='camera') renderCamera();
  else if(name==='files') renderFiles();
  else if(name==='social') renderSocial();
  else if(name==='calendar') renderCalendar();
  else if(name==='clock') renderClock();
  else if(name==='weather') renderWeather();
}
function shell(title,body,right='') {
  $('appContent').innerHTML=`<div class="app-header"><button class="back" onclick="goHome()">‹ Home</button><h2>${title}</h2><span>${right}</span></div><div class="app-body">${body}</div>`;
}

function renderChats() {
  const rows = contacts
    .slice()
    .sort((a,b) => {
      const ta = a.messages.at(-1)?.time || '';
      const tb = b.messages.at(-1)?.time || '';
      return tb.localeCompare(ta);
    })
    .map(c => `
      <button class="list-item" onclick="openChat('${c.id}')">
        <span class="avatar">${c.emoji || '👤'}</span>
        <span class="item-copy">
          <strong>${escapeHTML(c.name)}</strong>
          <small>${escapeHTML(c.preview || 'Belum ada pesan')}</small>
        </span>
        <small>${c.messages.at(-1)?.time || ''}</small>
      </button>
    `).join('');

  shell('WhatsApp', `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <strong style="font-size:25px">Chats</strong>
      <button onclick="addContact()" style="border:0;background:none;color:#128c7e;font-size:22px">＋</button>
    </div>
    <input id="contactSearch" placeholder="Search"
      style="width:100%;padding:10px;border:0;border-radius:10px;background:#e5e5ea"
      oninput="filterChats(this.value)">
    <div id="contactRows">${rows}</div>
    <button onclick="openChat('komplotan8')"
      style="width:100%;margin-top:14px;padding:12px;border:0;border-radius:12px;background:#128c7e;color:white">
      👥 Buka grup Komplotan 8
    </button>
  `);
}

function filterChats(value) {
  const query = value.toLowerCase();
  $('contactRows').innerHTML = contacts
    .filter(c => c.name.toLowerCase().includes(query))
    .map(c => `
      <button class="list-item" onclick="openChat('${c.id}')">
        <span class="avatar">${c.emoji || '👤'}</span>
        <span class="item-copy">
          <strong>${escapeHTML(c.name)}</strong>
          <small>${escapeHTML(c.preview || 'Belum ada pesan')}</small>
        </span>
      </button>
    `).join('');
}

function openChat(id) {
  currentContact = contacts.find(c => c.id === id);
  if (!currentContact) return;

  const c = currentContact;
  const isGroup = c.isGroup;

  const rows = c.messages.map(m => {
    if (m.from === 'system') {
      return `<div class="day-label">${escapeHTML(m.text)}</div>`;
    }

    return `
      <div class="bubble ${m.from === 'me' ? 'me' : 'them'}">
        ${isGroup && m.from !== 'me' && m.name
          ? `<strong style="font-size:11px;color:#128c7e">${escapeHTML(m.name)}</strong><br>`
          : ''}
        ${escapeHTML(m.text)}
        <small>${m.time}${m.from === 'me' ? ' ✓✓' : ''}</small>
      </div>
    `;
  }).join('');

  $('appContent').innerHTML = `
    <div class="chat-view active">
      <div class="chat-top">
        <button onclick="renderChats()">‹</button>
        <span class="avatar">${c.emoji || '👤'}</span>
        <div style="flex:1;min-width:0">
          <strong>${escapeHTML(c.name)}</strong>
          <div style="font-size:11px;color:#888">
            ${isGroup
              ? `${c.members.length} participants`
              : escapeHTML(c.number || 'Personal chat')}
          </div>
        </div>
        <button onclick="showChatDetails()">ⓘ</button>
      </div>

      <div class="chat-messages" id="chatMessages">
        <div class="day-label">TODAY</div>
        ${rows}
      </div>

      <form class="chat-compose" onsubmit="sendMessage(event)">
        <button type="button" onclick="toast('Attachment demo')">＋</button>
        <textarea id="messageInput" rows="1" placeholder="Message" required></textarea>
        <button class="send" type="submit">↑</button>
      </form>
    </div>
  `;

  const box = $('chatMessages');
  box.scrollTop = box.scrollHeight;
}

function sendMessage(event) {
  event.preventDefault();

  const input = $('messageInput');
  const message = input.value.trim();

  if (!message || !currentContact) return;

  const c = currentContact;
  const time = timeNow();

  c.messages.push({
    from: 'me',
    text: message,
    time
  });

  c.preview = message;
  saveWhatsApp();

  openChat(c.id);

  $('chatMessages').scrollTop = $('chatMessages').scrollHeight;

  $('lockNotice').innerHTML = `
    <strong>${escapeHTML(c.name)}</strong><br>
    ${escapeHTML(message)}
    <small style="display:block;margin-top:6px;opacity:.8">now</small>
  `;
}

function addContact() {
  const name = prompt('Nama kontak baru?');
  if (!name || !name.trim()) return;

  const cleanName = name.trim();

  const contact = {
    id: 'contact' + Date.now(),
    name: cleanName,
    number: '',
    emoji: '👤',
    preview: 'New chat',
    messages: []
  };

  contacts.push(contact);
  saveWhatsApp();
  openChat(contact.id);
}

function showChatDetails() {
  if (!currentContact) return;

  const c = currentContact;
  const details = c.isGroup
    ? `Anggota: ${c.members.join(', ')}`
    : `Nama: ${c.name}\nNomor: ${c.number || 'Belum diisi'}\nMuse: ${c.muse || '-'}`;

  alert(details);
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderNotes() {
  const saved=localStorage.getItem('rakaNotes')||'';
  shell('Notes',`<div style="color:#b49a00;font-size:12px;margin-bottom:12px">ON MY IPHONE</div><textarea id="noteText" class="note" placeholder="Start typing..." oninput="saveNotes()">${escapeHTML(saved)}</textarea><small id="noteStatus" style="color:#888">Saved on this device</small>`);
}
function saveNotes() {
  clearTimeout(notesTimer);
  $('noteStatus').textContent='Saving...';
  notesTimer=setTimeout(()=>{localStorage.setItem('rakaNotes',$('noteText').value);$('noteStatus').textContent='Saved on this device';},300);
}
function renderPhotos() {
  shell('Photos',`<div style="font-size:24px;font-weight:700;margin-bottom:15px">Library</div><p style="color:#888">Your memories, your way.</p><div class="photo-grid">${['🌅','🌃','🌷','🌊','🌙','☁️','🏙️','🌸','🌄'].map((x,i)=>`<button class="photo" onclick="toast('Photo ${i+1}: demo image')">${x}</button>`).join('')}</div><p style="font-size:12px;color:#888">Demo gallery — replace these placeholders with your own photos later.</p>`);

function renderSettings() {
  shell('Settings',`<div style="display:flex;gap:12px;align-items:center;padding:10px 0 20px"><div class="avatar">👤</div><div><strong>Raka</strong><div style="color:#888;font-size:12px">Apple Account · Local demo</div></div></div><div class="setting-row">✈️ Airplane Mode <input type="checkbox" onchange="toast('Setting updated')"></div><div class="setting-row">📶 Wi-Fi <span>Connected</span></div><div class="setting-row">🔵 Bluetooth <span>On</span></div><div class="setting-row">🔋 Battery <span>100%</span></div><h3>Wallpaper</h3><p style="color:#777;font-size:13px">Choose a background for the lock and home screens.</p><div class="wallpapers"><button class="wallpaper-choice" style="background:linear-gradient(145deg,#202b48,#8476a9,#d5a9bd)" onclick="setWallpaper(0)"></button><button class="wallpaper-choice" style="background:linear-gradient(145deg,#102d42,#277f91,#c4e8d7)" onclick="setWallpaper(1)"></button><button class="wallpaper-choice" style="background:linear-gradient(145deg,#42214b,#c45b82,#f2c5a8)" onclick="setWallpaper(2)"></button><button class="wallpaper-choice" style="background:linear-gradient(145deg,#080808,#484848,#b7b7b7)" onclick="setWallpaper(3)"></button></div>`);
}
function setWallpaper(n) {
  const w=[
    'linear-gradient(145deg,#202b48,#8476a9,#d5a9bd)',
    'linear-gradient(145deg,#102d42,#277f91,#c4e8d7)',
    'linear-gradient(145deg,#42214b,#c45b82,#f2c5a8)',
    'linear-gradient(145deg,#080808,#484848,#b7b7b7)'
  ];
  document.documentElement.style.setProperty('--wallpaper',w[n]);
  localStorage.setItem('rakaWallpaper',n);
  toast('Wallpaper updated');
}
const oldWallpaper=localStorage.getItem('rakaWallpaper');
if(oldWallpaper!==null)setWallpaper(Number(oldWallpaper));

  shell('Music',`<div style="text-align:center;padding-top:35px"><div style="font-size:100px">🎵</div><h2>Now Playing</h2><p style="color:#888">Raka's playlist</p><button onclick="toast('Music player demo — no audio attached')" style="border:0;border-radius:50%;background:#111;color:white;width:55px;height:55px;font-size:22px">▶</button><p style="font-size:12px;color:#888">Demo player</p></div>`);
